spring.datasource.url=jdbc:postgresql://localhost:5433/student_housing_test
spring.datasource.username=testuser
spring.datasource.password=testpassword
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Week 8: Do NOT run data.sql against the test database.
# Seeding (data.sql) must never interfere with tests; tests
# arrange their own data, so production/dev seed data stays out of the test DB.
spring.sql.init.mode=never

# Week 12: keep tests deterministic by turning off the Spring cache abstraction
# (otherwise @Cacheable results from one test could leak into the next inside a
# shared application context).
spring.cache.type=none