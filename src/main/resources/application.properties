spring.application.name=StudentHousing
spring.thymeleaf.cache=false

# === DATABASE CONFIGURATION (PostgreSQL) ===
spring.datasource.url=jdbc:postgresql://localhost:6432/housingdb
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driverClassName=org.postgresql.Driver

# === JPA / HIBERNATE CONFIGURATION ===
# Enables code-first flow: Hibernate creates/updates tables based on Entities
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# === DATA INITIALIZATION ===
# Seed data from data.sql
spring.sql.init.mode=always
# Defer data.sql execution until AFTER tables are created
spring.jpa.defer-datasource-initialization=true

# === PERFORMANCE & BEST PRACTICES ===
spring.jpa.open-in-view=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE