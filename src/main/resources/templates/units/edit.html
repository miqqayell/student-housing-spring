<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: commonHead('Edit Unit')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header bg-bordeaux text-white">
          <h4 class="mb-0">Edit Unit</h4>
        </div>
        <div class="card-body">
          <form th:action="@{/units/{id}/edit(id=${unitId})}" th:object="${housingUnitDto}" method="post">

            <div class="mb-3">
              <label class="form-label">Address</label>
              <input type="text" class="form-control" th:field="*{address}" th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''">
              <div class="invalid-feedback" th:errors="*{address}">Error</div>
            </div>

            <div class="mb-3">
              <label class="form-label">Unit Type</label>
              <select class="form-select" th:field="*{unitType}">
                <option value="APARTMENT">Apartment</option>
                <option value="STUDIO">Studio</option>
                <option value="SHARED_HOUSE">Shared House</option>
                <option value="DORM">Dorm (Student Room)</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Image URL</label>
              <input type="text" class="form-control" th:field="*{imageUrl}">
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Capacity</label>
                <input type="number" class="form-control" th:field="*{capacity}">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Rent</label>
                <div class="input-group">
                  <span class="input-group-text">€</span>
                  <input type="number" step="0.01" class="form-control" th:field="*{rent}">
                </div>
              </div>
            </div>

            <div class="mb-3 form-check form-switch">
              <input type="checkbox" class="form-check-input" th:field="*{furnished}">
              <label class="form-check-label">Furnished</label>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">Update Unit</button>
              <a th:href="@{/units/{id}(id=${unitId})}" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
