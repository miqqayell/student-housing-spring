<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/head :: commonHead('Unit Details')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!--/*
  ${unit} is a HousingUnitDetailDto. Its residents were loaded in the same query
  as the unit, and whether a resident's name may be shown was already decided by
  the service.
*/-->
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-bordeaux text-white">
      <h3 class="mb-0">Housing Unit Details</h3>
    </div>
    <div class="card-body">
      <div class="row">
        <!-- Large Image Section -->
        <div class="col-md-6 mb-4 mb-md-0">
          <img th:src="${unit.imageUrl != null ? unit.imageUrl : 'https://placehold.co/600x400?text=Unit'}"
               class="img-fluid rounded shadow-sm w-100" alt="Unit">
        </div>

        <!-- Info Section -->
        <div class="col-md-6">
          <h2 th:text="${unit.address}">Address</h2>
          <h4 class="text-primary fw-bold mb-4" th:text="'€ ' + ${unit.rent} + ' / month'">€ 500</h4>

          <div class="p-3 bg-light rounded mb-3">
            <p class="mb-1">
              <i class="bi bi-people-fill me-2 text-secondary"></i>
              Capacity: <strong th:text="${unit.capacity}">2</strong> students
            </p>
            <p class="mb-1">
              <strong>Type:</strong> <span th:text="${unit.unitType}">APARTMENT</span>
            </p>
            <!-- Polymorphic field: only a Dorm has a manager. -->
            <div th:if="${unit.managerName != null}">
              <p class="fw-bold text-success mb-0">
                <i class="bi bi-person-badge"></i> Manager: <span th:text="${unit.managerName}">Name</span>
              </p>
            </div>
          </div>

          <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between align-items-center">
              Furnished Status
              <span th:if="${unit.furnished}" class="badge bg-success rounded-pill">
                <i class="bi bi-check-lg"></i> Furnished
              </span>
              <span th:unless="${unit.furnished}" class="badge bg-secondary rounded-pill">
                <i class="bi bi-x-lg"></i> Unfurnished
              </span>
            </li>
            <li class="list-group-item">
              <small class="text-muted">Unit ID: <span th:text="${unit.id}">1</span></small>
            </li>
          </ul>

          <!-- Residents -->
          <div class="d-flex justify-content-between align-items-center mt-4 border-bottom pb-2">
            <h5 class="mb-0">Residents</h5>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/units/{id}/rent(id=${unit.id})}" class="btn btn-sm btn-success">
              <i class="bi bi-plus-circle"></i> Add Resident
            </a>
          </div>
          <table class="table table-sm table-hover" th:if="${not #lists.isEmpty(unit.residents)}">
            <thead>
            <tr>
              <th>Name</th>
              <th>Period</th>
              <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="resident : ${unit.residents}">
              <td>
                <span th:if="${resident.nameVisible}" th:text="${resident.studentName}">Name</span>
                <span th:unless="${resident.nameVisible}" class="text-muted">
                  <i class="bi bi-lock-fill"></i> Hidden Resident
                </span>
              </td>
              <td>
                <small th:text="${resident.startDate} + ' to ' + ${resident.endDate}">Dates</small>
              </td>
              <td>
                <a th:if="${resident.nameVisible}"
                   th:href="@{/students/{id}(id=${resident.studentId})}"
                   class="btn btn-sm btn-outline-primary">View</a>
              </td>
            </tr>
            </tbody>
          </table>
          <p class="text-muted mt-2" th:if="${#lists.isEmpty(unit.residents)}">No residents found.</p>
        </div>
      </div>
    </div>
    <div class="card-footer text-end">
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/units/{id}/edit(id=${unit.id})}" class="btn btn-warning me-2">Edit Unit</a>
      <a th:href="@{/units}" class="btn btn-secondary">Back to List</a>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
