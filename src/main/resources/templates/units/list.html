<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/head :: commonHead(#{units.title})}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-start" th:text="#{units.title}">Units</h2>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/units/add}" class="btn btn-success">
      <i class="bi bi-plus-circle me-1"></i> <span th:text="#{nav.addUnit}">Add</span>
    </a>
  </div>

  <!-- Search Form -->
  <div class="card p-3 mb-4 bg-light border-0">
    <form th:action="@{/units}" method="get" class="row g-3">
      <div class="col-md-5">
        <input type="number" class="form-control" name="minCapacity"
               th:placeholder="#{units.minCapacity}" th:value="${minCapacity}">
      </div>
      <div class="col-md-5">
        <input type="text" class="form-control" name="addressContains"
               th:placeholder="#{units.addressContains}" th:value="${addressContains}">
      </div>
      <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100" th:text="#{common.filter}">Filter</button>
      </div>
    </form>
  </div>

  <!-- Grid -->
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
    <div class="col" th:each="u : ${units}">
      <div class="card h-100 hover-card shadow-sm">
        <img th:src="${u.imageUrl != null ? u.imageUrl : 'https://placehold.co/300x200?text=Unit'}"
             class="card-img-top" alt="Unit"
             style="height: 200px; object-fit: cover;">

        <div class="card-body">
          <h5 class="card-title text-truncate" th:text="${u.address}">Address</h5>
          <p class="card-text mb-1">
            <i class="bi bi-people-fill me-1"></i> Capacity: <span th:text="${u.capacity}">0</span>
          </p>
          <p class="card-text fw-bold text-primary" th:text="'€ ' + ${u.rent}">€ 500</p>

          <span class="badge bg-secondary" th:text="${u.unitType}">Type</span>
        </div>

        <div class="card-footer bg-white border-top-0 d-flex justify-content-between">
          <a th:href="@{/units/{id}(id=${u.id})}" class="btn btn-outline-primary btn-sm">
            Details
          </a>

          <!--/*
            Deleting changes state, so it is a POST form (CSRF protected) rather
            than a GET link that a crawler or link prefetch could trigger.
          */-->
          <form sec:authorize="hasRole('ADMIN')" th:action="@{/units/{id}/delete(id=${u.id})}" method="post"
                onsubmit="return confirm('Are you sure you want to delete this unit?');">
            <button type="submit" class="btn btn-outline-danger btn-sm">
              <i class="bi bi-trash"></i>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
