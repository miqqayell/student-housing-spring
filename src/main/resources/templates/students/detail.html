<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: commonHead('Student Details')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!--/*
  ${student} is a StudentDetailDto: the rental history was loaded together with
  the student in a single query and the GPA visibility was already resolved.
*/-->
<div class="container mt-5">
  <div class="row">
    <div class="col-md-4">
      <div class="card shadow mb-4">
        <img th:src="${student.profileImageUrl != null ? student.profileImageUrl : 'https://placehold.co/400?text=No+Image'}" class="card-img-top" alt="Profile">
        <div class="card-body text-center">
          <h3 class="card-title" th:text="${student.name}">Name</h3>
          <span th:if="${student.international}" class="badge bg-info text-dark">International Student</span>
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <div class="card shadow mb-4">
        <div class="card-header bg-bordeaux text-white">
          <h4 class="mb-0">Student Information</h4>
        </div>
        <div class="card-body">
          <dl class="row">
            <dt class="col-sm-3">ID</dt>
            <dd class="col-sm-9" th:text="${student.id}">1</dd>

            <dt class="col-sm-3">Birth Date</dt>
            <!-- Week 11: data-birthdate is read by src/main/frontend/src/js/student-detail.js
                 which uses dayjs to render a human-friendly date. -->
            <dd class="col-sm-9" th:attr="data-birthdate=${student.birthDate}" th:text="${student.birthDate}">Date</dd>

            <dt class="col-sm-3">Year of Study</dt>
            <dd class="col-sm-9" th:text="${student.yearOfStudy}">2</dd>

            <dt class="col-sm-3">GPA</dt>
            <dd class="col-sm-9">
              <span th:if="${student.gpaVisible}">
                <span th:text="${student.gpa != null ? student.gpa : '-'}">3.5</span>
                <i th:if="${student.highGpa}" class="bi bi-star-fill text-warning ms-2"></i>
              </span>
              <span th:unless="${student.gpaVisible}" class="badge bg-secondary" style="font-size: 0.9rem;">
                <i class="bi bi-lock-fill"></i> GPA: Hidden
              </span>
            </dd>
          </dl>
        </div>
      </div>

      <div class="card shadow">
        <div class="card-header bg-light">
          <h5 class="mb-0">Rental History</h5>
        </div>
        <div class="card-body">
          <table class="table table-hover" th:if="${not #lists.isEmpty(student.leases)}">
            <thead>
            <tr>
              <th>Unit Address</th>
              <th>Dates</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="lease : ${student.leases}">
              <td th:text="${lease.unitAddress != null ? lease.unitAddress : 'Unknown Unit'}">Address</td>
              <td>
                <span th:text="${lease.startDate}">Start</span> - <span th:text="${lease.endDate}">End</span>
              </td>
              <td>
                <span th:if="${lease.active}" class="badge bg-success">Active</span>
                <span th:unless="${lease.active}" class="badge bg-secondary">Ended</span>
              </td>
              <td>
                <a th:if="${lease.unitId != null}" th:href="@{/units/{id}(id=${lease.unitId})}" class="btn btn-sm btn-outline-primary">View Unit</a>
              </td>
            </tr>
            </tbody>
          </table>
          <p class="text-muted" th:if="${#lists.isEmpty(student.leases)}">No rental history found.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="mt-3 mb-5">
    <a th:href="@{/students}" class="btn btn-secondary">Back to List</a>
  </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
